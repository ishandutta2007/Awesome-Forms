<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 64px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    
    /* CSS Animations for dynamic SVG effects */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes float-item {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes wave-bar {
      0%, 100% { height: 18px; }
      50% { height: 38px; }
    }
    @keyframes shimmer {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }

    .pulsing-orb {
      animation: pulse-glow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-card {
      animation: float-item 5s ease-in-out infinite;
    }
    .floating-card-delayed {
      animation: float-item 6s ease-in-out 1.5s infinite;
    }
    .shimmer-line {
      stroke-dasharray: 200 400;
      animation: shimmer 8s linear infinite;
    }
  </style>

  <!-- Background Card -->
  <rect width="1200" height="340" rx="20" fill="url(#bg-grad)" />
  
  <!-- Dynamic Glowing Orbs -->
  <circle cx="150" cy="80" r="140" fill="#4f46e5" opacity="0.25" class="pulsing-orb" filter="url(#glow)" />
  <circle cx="1050" cy="260" r="160" fill="#c084fc" opacity="0.2" class="pulsing-orb" filter="url(#glow)" />
  <circle cx="600" cy="170" r="180" fill="#6366f1" opacity="0.1" filter="url(#glow)" />

  <!-- Decorative Tech Grid Background overlay -->
  <path d="M 0 60 Q 300 120 600 60 T 1200 60" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" opacity="0.3" class="shimmer-line" />
  <path d="M 0 280 Q 300 220 600 280 T 1200 280" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" opacity="0.25" class="shimmer-line" />

  <!-- Left Form Visual Graphics Element -->
  <g transform="translate(80, 70)" class="floating-card">
    <rect width="180" height="200" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#soft-glow)"/>
    <rect x="20" y="24" width="100" height="12" rx="6" fill="#6366f1" />
    <rect x="20" y="48" width="140" height="8" rx="4" fill="#475569" />
    
    <!-- Input field 1 -->
    <rect x="20" y="72" width="140" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="34" cy="86" r="4" fill="#a855f7" />
    <rect x="46" y="83" width="60" height="6" rx="3" fill="#64748b" />
    
    <!-- Input field 2 (Checkbox style) -->
    <rect x="20" y="112" width="140" height="28" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <rect x="28" y="120" width="12" height="12" rx="3" fill="#6366f1" />
    <path d="M 31 126 L 34 129 L 38 123" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <rect x="48" y="123" width="75" height="6" rx="3" fill="#cbd5e1" />
    
    <!-- Submit Button -->
    <rect x="20" y="152" width="140" height="28" rx="6" fill="url(#accent-grad)" />
    <rect x="55" y="163" width="70" height="6" rx="3" fill="#ffffff" />
  </g>

  <!-- Central Title Section -->
  <g transform="translate(310, 135)">
    <!-- Main Headline -->
    <text x="0" y="0" class="title">Awesome Forms ⚡</text>
    <text x="0" y="38" class="subtitle">Curated collection of form builders, survey platforms & libraries</text>
    
    <!-- Feature Pill Badges -->
    <g transform="translate(0, 68)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="30" y="21" class="badge-text">Open Source First</text>

      <!-- Badge 2 -->
      <rect x="172" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="188" cy="16" r="5" fill="#6366f1" />
      <text x="202" y="21" class="badge-text">SaaS & Commercial</text>

      <!-- Badge 3 -->
      <rect x="354" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="370" cy="16" r="5" fill="#ec4899" />
      <text x="384" y="21" class="badge-text">Form Frameworks</text>
    </g>
  </g>

  <!-- Right Form Analytics Graphic Element -->
  <g transform="translate(940, 70)" class="floating-card-delayed">
    <rect width="180" height="200" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#soft-glow)"/>
    <text x="20" y="34" font-family="sans-serif" font-weight="700" font-size="14" fill="#cbd5e1">Submissions</text>
    <text x="20" y="56" font-family="sans-serif" font-weight="800" font-size="22" fill="#a855f7">99.8%</text>

    <!-- Animated Chart Bars -->
    <g transform="translate(20, 160)">
      <rect x="0" y="-40" width="16" height="40" rx="4" fill="#334155" />
      <rect x="24" y="-70" width="16" height="70" rx="4" fill="#6366f1" />
      <rect x="48" y="-55" width="16" height="55" rx="4" fill="#818cf8" />
      <rect x="72" y="-90" width="16" height="90" rx="4" fill="url(#accent-grad)" />
      <rect x="96" y="-65" width="16" height="65" rx="4" fill="#a855f7" />
      <rect x="120" y="-80" width="16" height="80" rx="4" fill="#ec4899" />
    </g>
  </g>

  <!-- Bottom Glowing Accent Line -->
  <rect x="0" y="334" width="1200" height="6" fill="url(#accent-grad)" />
</svg>
